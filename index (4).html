<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UzCRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel" data-type="module">
/* Sozlama config.js faylida — bu faylni tahrirlash shart emas */
const SUPABASE_URL = window.SUPABASE_URL || "";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "";

const { useState, useEffect, useCallback } = React;
const db = SUPABASE_URL ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const money = n => new Intl.NumberFormat("uz-UZ").format(Math.round(n || 0)) + " so'm";
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- Kichik UI bo'laklari ---------- */

const Btn = ({ children, onClick, kind = "primary", disabled, className = "" }) => {
  const styles = {
    primary: "bg-blue-600 text-white active:bg-blue-700",
    ghost: "bg-white border border-slate-300 text-slate-700 active:bg-slate-100",
    danger: "bg-red-500 text-white active:bg-red-600",
  }[kind];
  return (
    <button onClick={onClick} disabled={disabled}
      className={`rounded-lg px-4 py-2.5 text-sm font-medium disabled:opacity-40 ${styles} ${className}`}>
      {children}
    </button>
  );
};

const Input = props => (
  <input {...props}
    className={"w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 " + (props.className || "")} />
);

const Avatar = ({ name = "?", size = 32 }) => (
  <div className="rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold shrink-0"
    style={{ width: size, height: size, fontSize: size * 0.4 }}>
    {name.split(" ").map(w => w[0]).slice(0, 2).join("")}
  </div>
);

const Spinner = () => (
  <div className="flex justify-center py-16">
    <div className="w-8 h-8 border-3 border-blue-200 border-t-blue-600 rounded-full animate-spin"
      style={{ borderWidth: 3 }} />
  </div>
);

const Sheet = ({ open, onClose, children }) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40"
      onClick={onClose}>
      <div onClick={e => e.stopPropagation()}
        className="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto shadow-2xl">
        {children}
      </div>
    </div>
  );
};

/* Xatoni odam tushunadigan tilga o'girish */
function humanError(e) {
  const m = (e?.message || String(e)).replace(/^.*?:\s*/, "");
  if (/Invalid login/i.test(m)) return "Email yoki parol noto'g'ri";
  if (/limit/i.test(m)) return m;
  if (/majburiy/i.test(m)) return m;
  if (/row-level security|violates row-level/i.test(m)) return "Bu amalga ruxsatingiz yo'q";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Internetga ulanmadi";
  return m;
}

/* ---------- Kirish ---------- */

function Login() {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setErr("");
    const { error } = await db.auth.signInWithPassword({ email: email.trim(), password: pass });
    if (error) { setErr(humanError(error)); setBusy(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-5">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="text-3xl font-bold text-blue-700 tracking-tight">UzCRM</div>
          <div className="text-sm text-slate-500 mt-1">Savdo boshqaruv tizimi</div>
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
          <div>
            <div className="text-xs font-medium text-slate-500 mb-1.5">Email</div>
            <Input type="email" value={email} autoCapitalize="none" autoCorrect="off"
              onChange={e => { setEmail(e.target.value); setErr(""); }} />
          </div>
          <div>
            <div className="text-xs font-medium text-slate-500 mb-1.5">Parol</div>
            <Input type="password" value={pass}
              onChange={e => { setPass(e.target.value); setErr(""); }}
              onKeyDown={e => e.key === "Enter" && submit()} />
          </div>
          {err && <div className="text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5">{err}</div>}
          <Btn onClick={submit} disabled={busy || !email || !pass} className="w-full">
            {busy ? "Kirilmoqda…" : "Kirish"}
          </Btn>
        </div>
      </div>
    </div>
  );
}

/* ---------- Platforma egasi paneli ---------- */

function OwnerPanel({ me, onLogout }) {
  const [tenants, setTenants] = useState(null);
  const [msg, setMsg] = useState("");

  const load = useCallback(async () => {
    const { data, error } = await db.from("tenants").select("*").order("created_at");
    if (error) setMsg(humanError(error)); else setTenants(data);
  }, []);
  useEffect(() => { load(); }, [load]);

  const toggle = async (t) => {
    const { error } = await db.rpc("set_tenant_status",
      { p_tenant: t.id, p_status: t.status === "active" ? "blocked" : "active" });
    if (error) setMsg(humanError(error)); else load();
  };
  const extend = async (t) => {
    const { error } = await db.rpc("extend_payment", { p_tenant: t.id, p_days: 30 });
    if (error) setMsg(humanError(error)); else { setMsg("To'lov 30 kunga uzaytirildi"); load(); }
  };

  const active = (tenants || []).filter(t => t.status === "active");
  const mrr = active.reduce((a, t) => a + Number(t.price), 0);

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
        <div>
          <div className="font-bold text-blue-700">UzCRM</div>
          <div className="text-xs text-slate-500">Platforma paneli</div>
        </div>
        <button onClick={onLogout} className="ml-auto text-sm text-slate-500">Chiqish</button>
      </header>

      <div className="p-4 space-y-4">
        {msg && <div className="text-sm bg-blue-50 text-blue-800 rounded-lg px-3 py-2.5">{msg}</div>}

        <div className="grid grid-cols-3 gap-3">
          {[["Mijozlar", tenants?.length ?? "—"], ["Faol", active.length], ["Oylik", money(mrr)]].map(([k, v]) => (
            <div key={k} className="bg-white rounded-xl border border-slate-200 p-4">
              <div className="text-xs text-slate-500">{k}</div>
              <div className="text-base font-bold text-slate-900 mt-1 break-words">{v}</div>
            </div>
          ))}
        </div>

        {tenants === null ? <Spinner /> : tenants.length === 0 ? (
          <div className="bg-white rounded-xl border border-dashed border-slate-300 p-10 text-center">
            <div className="text-sm font-medium text-slate-800">Hali mijoz yo'q</div>
            <div className="text-xs text-slate-500 mt-1">Birinchi panelni ochish uchun qo'llanmaga qarang.</div>
          </div>
        ) : tenants.map(t => {
          const expired = t.paid_till < today();
          return (
            <div key={t.id} className="bg-white rounded-xl border border-slate-200 p-4">
              <div className="flex items-start gap-3">
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-slate-900">{t.name}</div>
                  <div className="text-xs text-slate-500">{t.owner_name} · {t.phone || "—"}</div>
                </div>
                <span className={`text-xs rounded-full px-2.5 py-1 font-medium shrink-0 ${
                  t.status === "active" ? "bg-green-50 text-green-700" : "bg-red-50 text-red-600"}`}>
                  {t.status === "active" ? "Faol" : "Bloklangan"}
                </span>
              </div>
              <div className="grid grid-cols-3 gap-2 mt-3 text-xs">
                <div><div className="text-slate-400">Tarif</div><div className="font-medium">{t.tariff}</div></div>
                <div><div className="text-slate-400">Limit</div><div className="font-medium">{t.user_limit} kishi</div></div>
                <div><div className="text-slate-400">To'lov</div>
                  <div className={`font-medium ${expired ? "text-red-600" : ""}`}>{t.paid_till}</div></div>
              </div>
              <div className="flex gap-2 mt-3">
                <Btn kind="ghost" onClick={() => extend(t)} className="flex-1">+30 kun</Btn>
                <Btn kind={t.status === "active" ? "danger" : "primary"} onClick={() => toggle(t)} className="flex-1">
                  {t.status === "active" ? "Bloklash" : "Ochish"}
                </Btn>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Lid kartochkasi ---------- */

function LeadSheet({ lead, stages, profiles, onClose, onSaved }) {
  const [tab, setTab] = useState("info");
  const [stageId, setStageId] = useState(lead.stage_id);
  const [budget, setBudget] = useState(lead.budget);
  const [notes, setNotes] = useState(null);
  const [tasks, setTasks] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [task, setTask] = useState({ body: "", due_date: today(), due_time: "10:00" });
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    db.from("notes").select("*").eq("lead_id", lead.id).order("created_at", { ascending: false })
      .then(({ data }) => setNotes(data || []));
    db.from("tasks").select("*").eq("lead_id", lead.id).order("due_date")
      .then(({ data }) => setTasks(data || []));
  }, [lead.id]);

  const save = async () => {
    setBusy(true); setMsg("");
    const { error } = await db.from("leads")
      .update({ stage_id: stageId, budget: Number(budget) || 0 }).eq("id", lead.id);
    setBusy(false);
    if (error) setMsg(humanError(error));
    else { onSaved(); onClose(); }
  };

  const addNote = async () => {
    if (!noteText.trim()) return;
    const { error } = await db.from("notes").insert({ lead_id: lead.id, body: noteText.trim() });
    if (error) return setMsg(humanError(error));
    setNoteText("");
    const { data } = await db.from("notes").select("*").eq("lead_id", lead.id).order("created_at", { ascending: false });
    setNotes(data || []);
  };

  const addTask = async () => {
    if (!task.body.trim()) return;
    const { error } = await db.from("tasks").insert({ lead_id: lead.id, ...task });
    if (error) return setMsg(humanError(error));
    setTask({ body: "", due_date: today(), due_time: "10:00" });
    const { data } = await db.from("tasks").select("*").eq("lead_id", lead.id).order("due_date");
    setTasks(data || []);
  };

  const toggleTask = async (t) => {
    await db.from("tasks").update({ done: !t.done }).eq("id", t.id);
    const { data } = await db.from("tasks").select("*").eq("lead_id", lead.id).order("due_date");
    setTasks(data || []);
  };

  return (
    <div>
      <div className="p-5 border-b border-slate-200 flex items-start gap-3 sticky top-0 bg-white">
        <div className="flex-1 min-w-0">
          <div className="text-lg font-bold text-slate-900">{lead.name}</div>
          <div className="text-sm text-slate-500">{lead.phone || "raqam yo'q"}</div>
        </div>
        <button onClick={onClose} className="text-slate-400 text-2xl leading-none px-2">×</button>
      </div>

      <div className="flex gap-1 px-4 pt-3">
        {[["info", "Ma'lumot"], ["task", "Zadacha"], ["note", "Izohlar"]].map(([k, t]) => (
          <button key={k} onClick={() => setTab(k)}
            className={`text-sm px-3 py-2 rounded-lg font-medium ${tab === k ? "bg-blue-50 text-blue-700" : "text-slate-500"}`}>
            {t}
          </button>
        ))}
      </div>

      <div className="p-5 space-y-4">
        {msg && <div className="text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5">{msg}</div>}

        {tab === "info" && (
          <>
            <div>
              <div className="text-xs font-medium text-slate-500 mb-1.5">Bosqich</div>
              <select value={stageId} onChange={e => setStageId(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base bg-white">
                {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div>
              <div className="text-xs font-medium text-slate-500 mb-1.5">Byudjet</div>
              <Input type="number" inputMode="numeric" value={budget} onChange={e => setBudget(e.target.value)} />
            </div>
            <div className="text-xs text-slate-500">
              Manba: {lead.source} · Yaratilgan: {String(lead.created_at).slice(0, 10)}
            </div>
            <Btn onClick={save} disabled={busy} className="w-full">
              {busy ? "Saqlanmoqda…" : "Saqlash"}
            </Btn>
          </>
        )}

        {tab === "task" && (
          <>
            <Input placeholder="Zadacha matni" value={task.body}
              onChange={e => setTask({ ...task, body: e.target.value })} />
            <div className="flex gap-2">
              <Input type="date" value={task.due_date} onChange={e => setTask({ ...task, due_date: e.target.value })} />
              <Input type="time" value={task.due_time} onChange={e => setTask({ ...task, due_time: e.target.value })} />
            </div>
            <Btn onClick={addTask} className="w-full">Qo'shish</Btn>
            <div className="space-y-2 pt-2">
              {tasks === null ? <Spinner /> : tasks.map(t => (
                <label key={t.id} className="flex items-center gap-3 bg-slate-50 rounded-lg p-3">
                  <input type="checkbox" checked={t.done} onChange={() => toggleTask(t)}
                    className="w-5 h-5 accent-blue-600" />
                  <span className={`text-sm flex-1 ${t.done ? "line-through text-slate-400" : "text-slate-800"}`}>{t.body}</span>
                  <span className="text-xs text-slate-500">{t.due_date} {String(t.due_time).slice(0, 5)}</span>
                </label>
              ))}
              {tasks?.length === 0 && <div className="text-sm text-slate-400 text-center py-4">Zadacha yo'q</div>}
            </div>
          </>
        )}

        {tab === "note" && (
          <>
            <textarea rows={3} value={noteText} onChange={e => setNoteText(e.target.value)}
              placeholder="Izoh yozing…"
              className="w-full border border-slate-300 rounded-lg p-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <Btn onClick={addNote} className="w-full">Saqlash</Btn>
            <div className="space-y-2 pt-2">
              {notes === null ? <Spinner /> : notes.map(n => (
                <div key={n.id} className="bg-slate-50 rounded-lg p-3">
                  <div className="text-xs text-slate-500">{String(n.created_at).slice(0, 16).replace("T", " ")}</div>
                  <div className="text-sm text-slate-800 mt-1">{n.body}</div>
                </div>
              ))}
              {notes?.length === 0 && <div className="text-sm text-slate-400 text-center py-4">Izoh yo'q</div>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------- Varonka ---------- */

function Funnel({ me, profile, onLogout }) {
  const [funnels, setFunnels] = useState(null);
  const [fid, setFid] = useState(null);
  const [stages, setStages] = useState([]);
  const [leads, setLeads] = useState(null);
  const [profiles, setProfiles] = useState([]);
  const [open, setOpen] = useState(null);
  const [adding, setAdding] = useState(false);
  const [nl, setNl] = useState({ name: "", phone: "", budget: "" });
  const [msg, setMsg] = useState("");
  const [tenantName, setTenantName] = useState("");

  useEffect(() => {
    db.from("funnels").select("*").order("position").then(({ data, error }) => {
      if (error) return setMsg(humanError(error));
      setFunnels(data || []);
      if (data?.length) setFid(data[0].id);
    });
    db.from("profiles").select("id,name").then(({ data }) => setProfiles(data || []));
    db.from("tenants").select("name").limit(1).then(({ data }) => setTenantName(data?.[0]?.name || ""));
  }, []);

  const loadLeads = useCallback(async (funnelId) => {
    if (!funnelId) return;
    const { data: st } = await db.from("stages").select("*").eq("funnel_id", funnelId).order("position");
    setStages(st || []);
    const { data: ld, error } = await db.from("leads").select("*").eq("funnel_id", funnelId)
      .order("created_at", { ascending: false });
    if (error) setMsg(humanError(error));
    setLeads(ld || []);
  }, []);

  useEffect(() => { if (fid) loadLeads(fid); }, [fid, loadLeads]);

  const addLead = async () => {
    if (!nl.name.trim()) return;
    const { error } = await db.from("leads").insert({
      name: nl.name.trim(), phone: nl.phone.trim() || null,
      budget: Number(nl.budget) || 0, funnel_id: fid, stage_id: stages[0]?.id,
      owner_id: profile.id, source: "Qo'lda",
    });
    if (error) return setMsg(humanError(error));
    setNl({ name: "", phone: "", budget: "" });
    setAdding(false);
    loadLeads(fid);
  };

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
        <div className="min-w-0">
          <div className="font-bold text-blue-700 truncate">{tenantName || "UzCRM"}</div>
          <div className="text-xs text-slate-500 truncate">{profile.name}</div>
        </div>
        <button onClick={onLogout} className="ml-auto text-sm text-slate-500 shrink-0">Chiqish</button>
      </header>

      {funnels === null ? <Spinner /> : (
        <>
          {funnels.length > 1 && (
            <div className="flex gap-1 bg-slate-100 rounded-lg p-1 m-4 w-fit">
              {funnels.map(f => (
                <button key={f.id} onClick={() => setFid(f.id)}
                  className={`text-sm px-4 py-2 rounded-md font-medium ${fid === f.id ? "bg-white text-blue-700 shadow-sm" : "text-slate-600"}`}>
                  {f.name}
                </button>
              ))}
            </div>
          )}

          <div className="px-4 pt-4 flex items-center gap-3">
            <div className="text-sm text-slate-500">
              {leads === null ? "Yuklanmoqda…" : `${leads.length} ta lid`}
            </div>
            <Btn onClick={() => setAdding(true)} className="ml-auto">+ Lid</Btn>
          </div>

          {msg && <div className="mx-4 mt-3 text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5">{msg}</div>}

          {leads === null ? <Spinner /> : (
            <div className="flex gap-3 overflow-x-auto p-4 pb-8">
              {stages.map(st => {
                const items = leads.filter(l => l.stage_id === st.id);
                const sum = items.reduce((a, b) => a + Number(b.budget), 0);
                return (
                  <div key={st.id} className="w-64 shrink-0 bg-slate-100 rounded-xl">
                    <div className="p-3 border-b border-slate-200">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: st.color }} />
                        <span className="text-sm font-semibold text-slate-800 truncate">{st.name}</span>
                        <span className="ml-auto text-xs text-slate-500 bg-white rounded-full px-2">{items.length}</span>
                      </div>
                      <div className="text-xs text-slate-500 mt-1">{money(sum)}</div>
                    </div>
                    <div className="p-2 space-y-2 min-h-[80px]">
                      {items.map(l => (
                        <div key={l.id} onClick={() => setOpen(l)}
                          className="bg-white rounded-lg border border-slate-200 p-3 active:border-blue-400">
                          <div className="text-sm font-semibold text-slate-900 leading-snug">{l.name}</div>
                          <div className="text-sm font-bold text-blue-700 mt-1">{money(l.budget)}</div>
                          <div className="text-[11px] text-slate-500 mt-1.5">{l.phone || "—"} · {l.source}</div>
                        </div>
                      ))}
                      {items.length === 0 && <div className="text-xs text-slate-400 text-center py-5">Bo'sh</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      <Sheet open={!!open} onClose={() => setOpen(null)}>
        {open && <LeadSheet lead={open} stages={stages} profiles={profiles}
          onClose={() => setOpen(null)} onSaved={() => loadLeads(fid)} />}
      </Sheet>

      <Sheet open={adding} onClose={() => setAdding(false)}>
        <div className="p-5 space-y-4">
          <div className="flex items-center">
            <div className="text-lg font-bold text-slate-900">Yangi lid</div>
            <button onClick={() => setAdding(false)} className="ml-auto text-slate-400 text-2xl leading-none px-2">×</button>
          </div>
          <Input placeholder="Lid nomi" value={nl.name} onChange={e => setNl({ ...nl, name: e.target.value })} />
          <Input placeholder="Telefon" type="tel" value={nl.phone} onChange={e => setNl({ ...nl, phone: e.target.value })} />
          <Input placeholder="Byudjet" type="number" inputMode="numeric" value={nl.budget}
            onChange={e => setNl({ ...nl, budget: e.target.value })} />
          <Btn onClick={addLead} className="w-full">Saqlash</Btn>
        </div>
      </Sheet>
    </div>
  );
}

/* ---------- Asosiy ---------- */

function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => { setSession(s); setProfile(null); });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) return;
    db.from("profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({ data, error }) => {
        if (error) setErr(humanError(error));
        else if (!data) setErr("Hisobingiz tizimga ulanmagan. Administratorga murojaat qiling.");
        else setProfile(data);
      });
  }, [session]);

  const logout = () => db.auth.signOut();

  if (!SUPABASE_URL || SUPABASE_URL.includes("BU_YERGA")) return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="max-w-sm text-center">
        <div className="text-lg font-bold text-slate-900">Sozlama kiritilmagan</div>
        <div className="text-sm text-slate-600 mt-2">
          <code className="bg-slate-100 px-1 rounded">config.js</code> faylidagi ikki qatorni
          Supabase ma'lumotlaringiz bilan to'ldiring.
        </div>
      </div>
    </div>
  );

  if (session === undefined) return <Spinner />;
  if (!session) return <Login />;

  if (err) return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="max-w-sm text-center">
        <div className="text-sm text-red-600 bg-red-50 rounded-lg px-4 py-3">{err}</div>
        <button onClick={logout} className="text-sm text-slate-500 mt-4">Chiqish</button>
      </div>
    </div>
  );

  if (!profile) return <Spinner />;
  if (profile.role === "owner") return <OwnerPanel me={session.user} onLogout={logout} />;
  return <Funnel me={session.user} profile={profile} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
