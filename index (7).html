function humanError(e) {
  const m = (e?.message || String(e)).replace(/^.*?:\s*/, "");
  if (/Invalid login/i.test(m)) return "Email yoki parol noto'g'ri";
  if (/limit|majburiy/i.test(m)) return m;
  if (/row-level security|violates row-level/i.test(m)) return "Bu amalga ruxsatingiz yo'q";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Internetga ulanmadi";
  return m;
}

};

const Donut = ({ data, size = 160 }) => {
  const total = data.reduce((a, d) => a + d.v, 0) || 1;
  const r = size / 2 - 14, C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div className="flex items-center gap-4">
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }} className="shrink-0">
        {data.map((d, i) => {
          const len = (d.v / total) * C, off = -acc; acc += len;
          return <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={d.c} strokeWidth="18"
            strokeDasharray={`${len} ${C - len}`} strokeDashoffset={off} />;
        })}

      <div className="space-y-1.5 min-w-0 flex-1">
        {data.map((d, i) => (
          <div key={i} className="flex items-center gap-2 text-xs text-slate-600">

const Ring = ({ score, size = 56 }) => {
  const c = score >= 70 ? "#16a34a" : score >= 40 ? "#f59e0b" : "#ef4444";
  const r = (size - 7) / 2, circ = 2 * Math.PI * r;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#e2e8f0" strokeWidth="5" />

function useDrag(onDrop) {
  const [drag, setDrag] = useState(null);
  const st = React.useRef(null);

  const onPointerDown = (e, id, label) => {
    if (e.button === 1 || e.button === 2) return;
    const r = e.currentTarget.getBoundingClientRect();
    const s = { id, label, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top,
      w: r.width, active: false, over: null };
    st.current = s;

    const cleanup = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    const move = ev => {
      const s2 = st.current; if (!s2) return;
      if (!s2.active) {
        if (Math.hypot(ev.clientX - s2.x0, ev.clientY - s2.y0) > 10) { clearTimeout(s2.timer); st.current = null; cleanup(); }
        return;
      }
      if (ev.cancelable) ev.preventDefault();
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const col = el && el.closest ? el.closest("[data-col]") : null;
      s2.over = col ? col.getAttribute("data-col") : null;
      setDrag({ id: s2.id, label: s2.label, x: ev.clientX, y: ev.clientY, dx: s2.dx, dy: s2.dy, w: s2.w, over: s2.over });
    };
    const up = () => {
      const s2 = st.current;
      if (s2) { clearTimeout(s2.timer); if (s2.active && s2.over) onDrop(s2.id, s2.over); }
      st.current = null; setDrag(null); cleanup();
    };
    s.timer = setTimeout(() => {
      s.active = true;
      if (navigator.vibrate) navigator.vibrate(12);
      setDrag({ id, label, x: e.clientX, y: e.clientY, dx: s.dx, dy: s.dy, w: s.w, over: null });
    }, 200);
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };
  return { drag, onPointerDown };
}

/* ---------- Kirish ---------- */
function Login() {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    setBusy(true); setErr("");
    const { error } = await db.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
    if (error) { setErr(humanError(error)); setBusy(false); }
  };
  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="w-full max-w-4xl grid md:grid-cols-2 rounded-2xl overflow-hidden shadow-xl bg-white">
        <div className="bg-blue-600 p-10 text-white hidden md:flex flex-col justify-between">
          <div>
            <div className="text-2xl font-bold tracking-tight">UzCRM</div>
            <div className="text-blue-200 text-sm mt-1">Savdo boshqaruv platformasi</div>
          </div>
          <div className="space-y-4 text-sm">
            <div className="flex gap-3 items-center"><Ic d={P.funnel} size={18} /> Bir nechta varonka</div>
            <div className="flex gap-3 items-center"><Ic d={P.ai} size={18} /> AI suhbat tahlili</div>
            <div className="flex gap-3 items-center"><Ic d={P.zap} size={18} /> Avtomatizatsiya robotlari</div>
            <div className="flex gap-3 items-center"><Ic d={P.users} size={18} /> Har mijozga alohida panel</div>
          </div>
          <div className="text-xs text-blue-200">Ishlab chiqarish versiyasi</div>
        </div>
        <div className="p-8 sm:p-10">
          <h1 className="text-xl font-bold text-slate-900">Tizimga kirish</h1>
          <p className="text-sm text-slate-500 mt-1">Hisobingiz bilan kiring.</p>
          <div className="mt-6 space-y-4">
            <Field label="Email"><Input type="email" value={email} autoCapitalize="none" autoCorrect="off"
              onChange={e => { setEmail(e.target.value); setErr(""); }} /></Field>
            <Field label="Parol"><Input type="password" value={pass}
              onChange={e => { setPass(e.target.value); setErr(""); }}
              onKeyDown={e => e.key === "Enter" && submit()} /></Field>
          </div>
          {err && <div className="mt-3 text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5">{err}</div>}
          <Btn onClick={submit} disabled={busy || !email || !pass} className="w-full mt-6">
            {busy ? "Kirilmoqda…" : "Kirish"}</Btn>
        </div></div></div>);
}

/* ---------- Platforma egasi ---------- */
function OwnerPanel({ onLogout }) {
  const [tenants, setTenants] = useState(null);
  const [msg, setMsg] = useState("");
  const load = useCallback(async () => {
    const { data, error } = await db.from("tenants").select("*").order("created_at");
    if (error) setMsg(humanError(error)); else setTenants(data);
  }, []);
  useEffect(() => { load(); }, [load]);
  const act = async (fn, args, ok) => {
    const { error } = await db.rpc(fn, args);
    if (error) setMsg(humanError(error)); else { setMsg(ok || ""); load(); }
  };
  const active = (tenants || []).filter(t => t.status === "active");
  const mrr = active.reduce((a, t) => a + Number(t.price), 0);
  const expiring = (tenants || []).filter(t => t.status === "active" && t.paid_till <= shift(14));

  return (
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center sticky top-0 z-20">
        <div>
          <div className="font-bold text-blue-700">UzCRM</div>
          <div className="text-xs text-slate-500">Platforma paneli</div>
        </div>
        <button onClick={onLogout} className="ml-auto text-sm text-slate-500 flex items-center gap-1.5">
          <Ic d={P.out} size={15} /> Chiqish</button>
      </header>
      <div className="p-4 sm:p-6 space-y-4">
        {msg && <div className="text-sm bg-blue-50 text-blue-800 rounded-lg px-3 py-2.5">{msg}</div>}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          {[["Jami mijozlar", tenants?.length ?? "—", P.build], ["Faol", active.length, P.task],
          ["Oylik daromad", money(mrr), P.file], ["Muddati tugayapti", expiring.length, P.clock]].map(([k, v, ic]) => (
            <Card key={k} className="p-4 sm:p-5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-medium text-slate-500">{k}</span>
                <span className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><Ic d={ic} size={16} /></span>
              </div>
              <div className="text-base sm:text-xl font-bold text-slate-900 mt-3 break-words">{v}</div>
            </Card>))}
        </div>
        {tenants === null ? <Spinner /> : !tenants.length ? (
          <Empty title="Hali mijoz yo'q" hint="Yangi panel ochish uchun qo'llanmaga qarang." />
        ) : tenants.map(t => (
          <Card key={t.id} className="p-4 sm:p-5">
            <div className="flex items-start gap-3">

            </div>
            <div className="flex gap-2 mt-4">
              <Btn kind="ghost" className="flex-1" onClick={() => act("extend_payment", { p_tenant: t.id, p_days: 30 }, "30 kunga uzaytirildi")}>+30 kun</Btn>
              <Btn kind={t.status === "active" ? "danger" : "primary"} className="flex-1"
                onClick={() => act("set_tenant_status", { p_tenant: t.id, p_status: t.status === "active" ? "blocked" : "active" })}>
                {t.status === "active" ? "Bloklash" : "Ochish"}</Btn>
            </div></Card>))}
      </div></div>);
}

/* ---------- AI ---------- */
function analyze(lead, x, scenario) {
  const { calls = [], messages = [], notes = [], tasks = [] } = x;
  const talk = calls.reduce((a, c) => a + (c.duration || 0), 0);
  const out = messages.filter(m => m.direction === "out").length;
  const inc = messages.filter(m => m.direction === "in").length;
  const openT = tasks.filter(t => !t.done).length;
  const days = Math.max(0, Math.round((Date.now() - new Date(lead.created_at)) / 86400000));
  const flags = [calls.length > 0, inc > 0 || calls.length > 0, Number(lead.budget) > 0,
    talk > 120, out >= inc && inc > 0, openT > 0, out > 0 || notes.length > 0];
  const checks = scenario.map((name, i) => ({ name, ok: !!flags[i], comment: flags[i] ? "Bajarilgan" : "Tizimda iz qolmagan" }));
  const score = Math.round((checks.filter(c => c.ok).length / Math.max(1, checks.length)) * 100);
  const mistakes = [];
  if (!calls.length) mistakes.push("Birorta qo'ng'iroq qilinmagan");
  if (!openT) mistakes.push("Keyingi qadam belgilanmagan — lid nazoratsiz");
  if (days > 5 && calls.length < 2) mistakes.push(`Lid ${days} kundan beri ochiq, aloqa kam`);
  if (inc > out) mistakes.push("Mijoz javob kutmoqda");
  if (talk > 0 && talk < 60) mistakes.push("Suhbat juda qisqa, ehtiyoj aniqlanmagan");
  if (!Number(lead.budget)) mistakes.push("Byudjet kiritilmagan");
  const advice = [];
  if (!openT) advice.push("Bugunga aniq vaqtli zadacha qo'ying");
  if (inc > out) advice.push("Javobsiz xabarga tez javob bering");
  if (calls.length < 2) advice.push("Yozishmadan qo'ng'iroqqa o'ting");
  if (!advice.length) advice.push("Lid to'g'ri yuritilmoqda");
  return { score, quality: score >= 70 ? "issiq" : score >= 40 ? "iliq" : "sovuq", checks,
    mistakes: mistakes.slice(0, 5), advice: advice.slice(0, 3),
    summary: `Skript bo'yicha ${checks.filter(c => c.ok).length}/${checks.length} band bajarilgan.`,
    at: new Date().toISOString() };
}

                    <Field key={x.id} label={label}>
                      {x.type === "select" ? (
                        <Select value={v} disabled={!can("leads_edit")} onChange={e => set(e.target.value)}>
                          <option value="">Tanlang…</option>
                          {(x.options || []).map(o => <option key={o} value={o}>{o}</option>)}</Select>
                      ) : x.type === "checkbox" ? (
                        <label className="flex items-center gap-2 text-sm text-slate-700">
                          <input type="checkbox" checked={!!v} disabled={!can("leads_edit")} className="w-4 h-4 accent-blue-600"
                            onChange={e => set(e.target.checked)} /> Ha</label>
                      ) : x.type === "textarea" ? (
                        <textarea rows={2} value={v} disabled={!can("leads_edit")} onChange={e => set(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      ) : (
                        <Input type={x.type === "number" ? "number" : x.type === "date" ? "date" : "text"}
                          value={v} disabled={!can("leads_edit")} onChange={e => set(e.target.value)} />
                      )}
                    </Field>);
                })}
              </div>);
          })}

          <Btn onClick={save} disabled={busy || !can("leads_edit")} className="w-full">{busy ? "Saqlanmoqda…" : "Saqlash"}</Btn>
          <div className="text-xs text-slate-500">Yaratilgan: {short(lead.created_at)}</div>
        </div>
      </div>
    </div>);
}

      <iframe src={dash.url} title="Dashboard" className="w-full" style={{ height: "70vh", border: 0 }} /></Card></div>;
  }
  const W = (dash && dash.widgets) || {};
  const on = k => W[k] !== false;
  const sum = leads.filter(l => !/yo'qot|lost/i.test((stages.find(s => s.id === l.stage_id) || {}).name || "")).reduce((a, b) => a + Number(b.budget), 0);

  const kpi = [["Lidlar", leads.length, P.funnel], ["Varonka summasi", money(sum), P.file],
    ["Ochiq zadacha", openT.length, P.task], ["Muddati o'tgan", overdue.length, P.clock]];

  return (
    <div className="p-4 sm:p-6 space-y-4">

            <div className="text-base sm:text-xl font-bold text-slate-900 mt-3 break-words">{v}</div></Card>))}

          <div className="text-sm font-semibold text-slate-900 mb-2">Bosqichlar bo'yicha lidlar</div>
          <Bars data={byStage} /></Card>}
        {on("sources") && <Card className="p-5">
          <div className="text-sm font-semibold text-slate-900 mb-3">Lid manbalari</div>
          {bySource.length ? <Donut data={bySource} /> : <div className="text-sm text-slate-400 py-8 text-center">Ma'lumot yo'q</div>}</Card>}
      </div>
      {on("managers") && <Card className="p-5">
        <div className="text-sm font-semibold text-slate-900 mb-3">Menejerlar</div>
        <div className="space-y-3">
          {people.map(p => {
            const mine = leads.filter(l => l.owner_id === p.id);
            return (
              <div key={p.id} className="flex items-center gap-3">
                <Avatar name={p.name} size={30} />

                  <div className="h-1.5 bg-slate-100 rounded-full mt-1.5">
                    <div className="h-1.5 bg-blue-600 rounded-full" style={{ width: `${Math.max(4, (mine.length / Math.max(1, leads.length)) * 100)}%` }} /></div></div>

/* ---------- Zadachalar ---------- */
const TASK_COLS = [
  { id: "over", name: "Muddati o'tgan", c: "#ef4444" }, { id: "today", name: "Bugungi", c: "#2563eb" },
  { id: "tom", name: "Ertangi", c: "#3b82f6" }, { id: "week", name: "Keyingi 7 kun", c: "#60a5fa" },
  { id: "later", name: "Keyinroq", c: "#94a3b8" }, { id: "done", name: "Bajarilgan", c: "#16a34a" }];
const taskCol = t => {
  if (t.done) return "done";
  const d = t.due_date, td = today();
  if (!d) return "later";
  if (d < td) return "over";
  if (d === td) return "today";
  if (d === shift(1)) return "tom";
  if (d <= shift(7)) return "week";
  return "later";
};

function TasksBoard({ tasks, leads, onMove }) {
  return (
    <div className="p-4 sm:p-6">
      <div className="mb-4">
        <h2 className="text-lg font-bold text-slate-900">Zadacha varonkasi</h2>
        <p className="text-xs text-slate-500">Muddatini o'zgartirish uchun zadacha ustiga bosing</p>
      </div>
      <div className="flex gap-3 overflow-x-auto pb-6">
        {TASK_COLS.map(col => {
          const items = tasks.filter(t => taskCol(t) === col.id)
            .sort((a, b) => (a.due_date + a.due_time).localeCompare(b.due_date + b.due_time));
          return (
            <div key={col.id} className="w-60 shrink-0 rounded-xl border border-slate-200 bg-slate-50">
              <div className="p-3 border-b border-slate-200 flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: col.c }} />
                <span className="text-sm font-semibold text-slate-800 truncate">{col.name}</span>
                <span className="ml-auto text-xs text-slate-500 bg-white border border-slate-200 rounded-full px-2">{items.length}</span></div>
              <div className="p-2 space-y-2 min-h-[90px]">
                {items.map(t => {
                  const lead = leads.find(l => l.id === t.lead_id);

                    <div key={t.id} onClick={() => onMove(t)}

                      <div className={`text-sm ${t.done ? "line-through text-slate-400" : "text-slate-900"}`}>{t.body}</div>
                      {lead && <div className="text-[11px] text-slate-500 mt-1 truncate">{lead.name}</div>}
                      <div className={`text-[11px] mt-1 tabular-nums ${col.id === "over" ? "text-red-600 font-medium" : "text-slate-500"}`}>

/* ---------- AI bo'limi ---------- */
function AIView({ leads, people, scenario, setScenario, onOpen, onBulk }) {
  const [tab, setTab] = useState("review");
  const [busy, setBusy] = useState(false);
  const done = leads.filter(l => l.ai);
  const avg = done.length ? Math.round(done.reduce((a, l) => a + l.ai.score, 0) / done.length) : 0;
  const byQ = ["issiq", "iliq", "sovuq"].map((q, i) => ({ n: q, v: done.filter(l => l.ai.quality === q).length, c: ["#ef4444", "#f59e0b", "#0ea5e9"][i] })).filter(x => x.v);
  const mc = {}; done.forEach(l => (l.ai.mistakes || []).forEach(m => { mc[m] = (mc[m] || 0) + 1; }));
  const top = Object.entries(mc).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const checkStats = scenario.map(name => {
    const rel = done.filter(l => (l.ai.checks || []).some(c => c.name === name));
    const ok = rel.filter(l => (l.ai.checks.find(c => c.name === name) || {}).ok).length;
    const pct = rel.length ? Math.round((ok / rel.length) * 100) : 0;
    return { n: name.length > 14 ? name.slice(0, 13) + "…" : name, v: pct, c: pct >= 70 ? "#16a34a" : pct >= 40 ? "#f59e0b" : "#ef4444" };
  });
  const byMgr = people.map(u => {
    const mine = done.filter(l => l.owner_id === u.id);
    return { u, n: mine.length, avg: mine.length ? Math.round(mine.reduce((a, l) => a + l.ai.score, 0) / mine.length) : 0 };
  }).sort((a, b) => b.avg - a.avg);

  return (
    <div className="p-4 sm:p-6 space-y-4">
      <div className="flex items-center gap-3 flex-wrap">
        <Tabs items={[["review", "Umumiy tahlil"], ["script", "Savdo skripti"]]} value={tab} onChange={setTab} />
        {tab === "review" && <Btn className="ml-auto" disabled={busy}
          onClick={async () => { setBusy(true); await onBulk(); setBusy(false); }}>

          <Card className="p-5"><div className="text-sm font-semibold text-slate-900 mb-3">Menejerlar sifat reytingi</div>
            <div className="space-y-3">

        </div>
        <Card className="divide-y divide-slate-100">

    </div>);
}

/* ---------- Kontaktlar ---------- */
function ContactsView({ contacts, companies, reload, setMsg }) {
  const [tab, setTab] = useState("c");
  const [add, setAdd] = useState(false);
  const [f, setF] = useState({ name: "", phone: "", email: "", position_title: "", company_id: "", site: "", address: "" });
  const save = async () => {
    if (!f.name.trim()) return;
    const p = tab === "c"
      ? db.from("contacts").insert({ name: f.name, phone: f.phone, email: f.email, position_title: f.position_title, company_id: f.company_id || null })
      : db.from("companies").insert({ name: f.name, phone: f.phone, site: f.site, address: f.address });
    const { error } = await p;
    if (error) return setMsg(humanError(error));
    setF({ name: "", phone: "", email: "", position_title: "", company_id: "", site: "", address: "" });
    setAdd(false); reload();
  };
  const list = tab === "c" ? contacts : companies;
  return (
    <div className="p-4 sm:p-6 space-y-4">
      <div className="flex items-center gap-2 flex-wrap">
        <Tabs items={[["c", "Kontaktlar"], ["k", "Kompaniyalar"]]} value={tab} onChange={setTab} />
        <Btn className="ml-auto" onClick={() => setAdd(true)}><Ic d={P.plus} size={16} /> Qo'shish</Btn>
      </div>
      <Card className="divide-y divide-slate-100">
        {list.map(x => (
          <div key={x.id} className="flex items-center gap-3 p-4">
            {tab === "c" ? <Avatar name={x.name} size={38} />
              : <span className="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0"><Ic d={P.build} size={18} /></span>}
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium text-slate-900 truncate">{x.name}</div>
              <div className="text-xs text-slate-500 truncate">
                {tab === "c"
                  ? `${x.position_title || "—"} · ${(companies.find(c => c.id === x.company_id) || {}).name || "kompaniyasiz"}`
                  : x.address || "—"}</div></div>
            <div className="text-xs text-slate-600 hidden sm:block">{x.phone}</div>
            <button className="text-slate-400 px-2"
              onClick={async () => { await db.from(tab === "c" ? "contacts" : "companies").delete().eq("id", x.id); reload(); }}><Ic d={P.x} size={16} /></button>
          </div>))}
        {!list.length && <div className="p-10 text-center text-sm text-slate-400">Ro'yxat bo'sh</div>}
      </Card>
      <Sheet open={add} onClose={() => setAdd(false)}>
        <div className="p-5 space-y-3">
          <div className="text-lg font-bold text-slate-900">{tab === "c" ? "Yangi kontakt" : "Yangi kompaniya"}</div>
          <Input placeholder="Nomi" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} />
          <Input placeholder="Telefon" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} />
          {tab === "c" ? <>
            <Input placeholder="Email" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} />
            <Input placeholder="Lavozimi" value={f.position_title} onChange={e => setF({ ...f, position_title: e.target.value })} />
            <Select value={f.company_id} onChange={e => setF({ ...f, company_id: e.target.value })}>
              <option value="">Kompaniyasiz</option>{companies.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</Select>
          </> : <>
            <Input placeholder="Sayt" value={f.site} onChange={e => setF({ ...f, site: e.target.value })} />
            <Input placeholder="Manzil" value={f.address} onChange={e => setF({ ...f, address: e.target.value })} />
          </>}
          <Btn className="w-full" onClick={save}>Saqlash</Btn>
        </div></Sheet>
    </div>);
}

            return (
              <div key={r.id} className="flex items-center gap-3 p-4">
                <span className="w-9 h-9 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0"><Ic d={P.zap} size={16} /></span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-slate-900"><span className="text-slate-500">{f && f.name} → </span>
                    <b>{(s || {}).name || "?"}</b><span className="text-slate-500"> → {{ task: "zadacha", sms: "SMS", telegram: "Telegram" }[r.action]}</span></div>
                  <div className="text-xs text-slate-500 truncate">{r.value}</div></div>
                <Toggle on={r.enabled} onChange={v => upd("robots", r.id, { enabled: v })} />
                <button className="text-slate-400 px-1" onClick={() => del("robots", r.id)}><Ic d={P.x} size={16} /></button>
              </div>);
          })}
          {!robots.length && <div className="p-10 text-center text-sm text-slate-400">Qoida yo'q</div>}
        </Card>
      </>}

      {sec === "dash" && (
        <div className="max-w-2xl space-y-4">
          <Card className="p-5 space-y-2">
            <div className="text-sm font-semibold text-slate-900 mb-1">Dashboard manbasi</div>
            {[["internal", "Ichki dashboard", "CRM ma'lumotlaridan avtomatik quriladi"],
            ["external", "O'z dashboardim", "Tashqi havolani oynaga joylash (Looker Studio, Metabase, Power BI)"]].map(([k, t, d2]) => (
              <label key={k} className={`flex gap-3 p-3 rounded-lg border cursor-pointer ${(dash.mode || "internal") === k ? "border-blue-500 bg-blue-50" : "border-slate-200"}`}>
                <input type="radio" checked={(dash.mode || "internal") === k} className="mt-0.5 accent-blue-600"
                  onChange={() => saveSettings({ dashboard: { ...dash, mode: k } })} />
                <div><div className="text-sm font-medium text-slate-900">{t}</div>
                  <div className="text-xs text-slate-500">{d2}</div></div></label>))}
            {dash.mode === "external" && (
              <Field label="Dashboard havolasi (embed URL)">
                <Input value={dash.url || ""} placeholder="https://lookerstudio.google.com/embed/..."
                  onChange={e => saveSettings({ dashboard: { ...dash, url: e.target.value } })} /></Field>)}
          </Card>
          {(dash.mode || "internal") === "internal" && (
            <Card className="divide-y divide-slate-100">
              <div className="px-4 py-3 text-sm font-semibold text-slate-900">Qaysi bloklar ko'rinsin</div>
              {Object.entries({ kpi: "Yuqori ko'rsatkichlar", stages: "Bosqichlar diagrammasi", sources: "Lid manbalari", managers: "Menejerlar" }).map(([k, label]) => (
                <div key={k} className="flex items-center gap-4 p-4">
                  <div className="flex-1 text-sm text-slate-800">{label}</div>
                  <Toggle on={(dash.widgets || {})[k] !== false}
                    onChange={v => saveSettings({ dashboard: { ...dash, widgets: { ...(dash.widgets || {}), [k]: v } } })} />
                </div>))}
            </Card>)}
        </div>)}

      {sec === "modules" && (
        <Card className="divide-y divide-slate-100 max-w-2xl">
          {Object.entries(MODULE_NAMES).map(([k, label]) => (
            <div key={k} className="flex items-center gap-4 p-4">
              <div className="flex-1"><div className="text-sm font-medium text-slate-900">{label}</div>
                <div className="text-xs text-slate-500">Bo'limni yoqish yoki o'chirish</div></div>
              <Toggle on={mod[k] !== false} onChange={v => saveSettings({ modules: { ...mod, [k]: v } })} />
            </div>))}
        </Card>)}
    </div>);
}

/* ---------- Ish maydoni ---------- */
function Workspace({ profile, onLogout }) {
  const [view, setView] = useState("funnel");
  const [msg, setMsg] = useState("");
  const [loading, setLoading] = useState(true);
  const [menu, setMenu] = useState(false);
  const [q, setQ] = useState("");
  const [D, setD] = useState({ tenant: null, funnels: [], stages: [], leads: [], tasks: [], people: [],
    products: [], contacts: [], companies: [], robots: [], messages: [], calls: [], groups: [], fields: [], settings: null });
  const [fid, setFid] = useState(null);
  const [open, setOpen] = useState(null);
  const [adding, setAdding] = useState(false);
  const [nl, setNl] = useState({ name: "", phone: "", budget: "", source: "Qo'lda" });

  const can = k => profile.role === "admin" || (profile.perms || []).includes(k);

  const load = useCallback(async () => {
    const res = await Promise.all([
      db.from("tenants").select("*").limit(1).maybeSingle(),
      db.from("funnels").select("*").order("position"),
      db.from("stages").select("*").order("position"),
      db.from("leads").select("*").order("created_at", { ascending: false }),
      db.from("tasks").select("*").order("due_date"),
      db.from("profiles").select("*").order("name"),
      db.from("products").select("*").order("name"),
      db.from("contacts").select("*").order("name"),
      db.from("companies").select("*").order("name"),
      db.from("robots").select("*"),
      db.from("messages").select("*").order("created_at"),
      db.from("calls").select("*").order("created_at", { ascending: false }),
      db.from("field_groups").select("*").order("position"),
      db.from("fields").select("*").order("position"),
      db.from("settings").select("*").limit(1).maybeSingle()]);
    const bad = res.find(r => r.error);
    if (bad) setMsg(humanError(bad.error));
    setD({ tenant: res[0].data, funnels: res[1].data || [], stages: res[2].data || [], leads: res[3].data || [],
      tasks: res[4].data || [], people: res[5].data || [], products: res[6].data || [], contacts: res[7].data || [],
      companies: res[8].data || [], robots: res[9].data || [], messages: res[10].data || [], calls: res[11].data || [],
      groups: res[12].data || [], fields: res[13].data || [], settings: res[14].data });
    setFid(prev => prev || ((res[1].data || [])[0] || {}).id || null);
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  const settings = D.settings || {};
  const mod = settings.modules || {};
  const scenario = (settings.scenario && settings.scenario.checks && settings.scenario.checks.length)
    ? settings.scenario.checks : SCENARIO_DEF;

  const saveSettings = async (patch) => {
    setD(p => ({ ...p, settings: { ...(p.settings || {}), ...patch } }));
    const { error } = await db.from("settings").update(patch).eq("tenant_id", D.tenant && D.tenant.id);
    if (error) setMsg(humanError(error));
  };
  const setScenario = checks => saveSettings({ scenario: { ...(settings.scenario || {}), checks } });

  const curStages = D.stages.filter(s => s.funnel_id === fid);
  const curLeads = D.leads.filter(l => l.funnel_id === fid)
    .filter(l => !q || (l.name + (l.phone || "")).toLowerCase().includes(q.toLowerCase()));
  const managers = D.people.filter(p => p.role === "manager" && p.active);

  const addLead = async () => {
    if (!nl.name.trim()) return;
    const { error } = await db.from("leads").insert({ name: nl.name.trim(), phone: nl.phone.trim() || null,
      budget: Number(nl.budget) || 0, funnel_id: fid, stage_id: (curStages[0] || {}).id, owner_id: profile.id, source: nl.source });
    if (error) return setMsg(humanError(error));
    setNl({ name: "", phone: "", budget: "", source: "Qo'lda" }); setAdding(false); load();
  };
  const moveTask = async (t) => {
    const order = ["over", "today", "tom", "week", "later", "done"];
    const next = order[(order.indexOf(taskCol(t)) + 1) % order.length];
    const patch = next === "done" ? { done: true } : { done: false, due_date:
      next === "over" ? shift(-1) : next === "today" ? today() : next === "tom" ? shift(1) : next === "week" ? shift(3) : shift(14) };
    const { error } = await db.from("tasks").update(patch).eq("id", t.id);
    if (error) setMsg(humanError(error)); else load();
  };
  const toggleTask = async (t) => { await db.from("tasks").update({ done: !t.done }).eq("id", t.id); load(); };

  const moveLead = async (id, stage_id) => {
    setD(p => ({ ...p, leads: p.leads.map(l => l.id === id ? { ...l, stage_id } : l) }));
    const { error } = await db.from("leads").update({ stage_id }).eq("id", id);
    if (error) { setMsg(humanError(error)); }
    load();
  };
  const bulkMove = async (ids, stage_id) => {
    const { error } = await db.from("leads").update({ stage_id }).in("id", ids);
    if (error) setMsg(humanError(error)); else load();
  };
  const accept = async (l) => {
    const { error } = await db.from("leads").update({ unsorted: false, owner_id: profile.id }).eq("id", l.id);
    if (error) setMsg(humanError(error)); else load();
  };
  const allTags = [...new Set(D.leads.flatMap(l => l.tags || []))].sort();
  const unsorted = D.leads.filter(l => l.unsorted);
  const overdue = D.tasks.filter(t => !t.done && t.due_date < today()).length;
  const bulkAi = async () => {
    const todo = D.leads.filter(l => !l.ai).slice(0, 20);
    for (const l of todo) {
      const [n, t, c, m] = await Promise.all([
        db.from("notes").select("*").eq("lead_id", l.id), db.from("tasks").select("*").eq("lead_id", l.id),
        db.from("calls").select("*").eq("lead_id", l.id), db.from("messages").select("*").eq("lead_id", l.id)]);
      const res = analyze(l, { notes: n.data || [], tasks: t.data || [], calls: c.data || [], messages: m.data || [] }, scenario);
      await db.from("leads").update({ ai: res }).eq("id", l.id);
    }
    load();
  };

  const nav = [
    ["inbox", "Qabul qilinmagan", P.file, true, unsorted.length],
    ["dash", "Dashboard", P.dash, mod.dashboard !== false],
    ["funnel", "Varonka", P.funnel, mod.funnel !== false],
    ["chats", "Xabarlar", P.chat, mod.chats !== false],
    ["ai", "AI model", P.ai, mod.ai !== false],
    ["contacts", "Kontaktlar", P.users, mod.contacts !== false],
    ["products", "Mahsulotlar", P.pack, mod.products !== false],
    ["taskboard", "Zadacha varonkasi", P.board, mod.taskboard !== false],
    ["tasks", "Zadachalar", P.task, mod.tasks !== false, overdue],
    ["calls", "Qo'ng'iroqlar", P.phone, mod.calls !== false && can("calls_listen")],
    ["settings", "Sozlamalar", P.gear, can("settings_access")],
  ].filter(x => x[3]);

  const NavList = ({ onPick }) => (
    <nav className="p-3 space-y-1">
      {nav.map(([k, label, icon, , badge]) => (
        <button key={k} onClick={() => { setView(k); onPick && onPick(); }}
          className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${view === k ? "bg-blue-600 text-white" : "text-slate-600 hover:bg-blue-50 hover:text-blue-700"}`}>
          <Ic d={icon} size={17} /> <span className="flex-1 text-left truncate">{label}</span>
          {badge > 0 && <span className={`text-[10px] rounded-full px-1.5 py-0.5 font-semibold ${view === k ? "bg-white text-blue-700" : "bg-red-500 text-white"}`}>{badge}</span>}
        </button>))}
    </nav>);

  return (
    <div className="min-h-screen bg-slate-50 flex">
      <aside className="w-60 bg-white border-r border-slate-200 flex-col shrink-0 hidden lg:flex">
        <div className="p-5 border-b border-slate-200">
          <div className="text-lg font-bold text-blue-700 tracking-tight">UzCRM</div>
          <div className="text-xs text-slate-500 truncate">{(D.tenant || {}).name || "—"}</div>
        </div>
        <div className="flex-1 overflow-y-auto"><NavList /></div>
        <div className="p-3 border-t border-slate-200 flex items-center gap-3">
          <Avatar name={profile.name} size={34} />
          <div className="flex-1 min-w-0"><div className="text-sm font-medium text-slate-800 truncate">{profile.name}</div>
            <div className="text-xs text-slate-500">{profile.role === "admin" ? "Admin" : "Menejer"}</div></div>
          <button onClick={onLogout} className="text-slate-400 p-1"><Ic d={P.out} size={16} /></button>
        </div>
      </aside>

      {menu && (
        <div className="fixed inset-0 z-40 lg:hidden" onClick={() => setMenu(false)}>
          <div className="absolute inset-0 bg-slate-900/40" />
          <div className="absolute left-0 top-0 bottom-0 w-64 bg-white shadow-xl flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="p-4 border-b border-slate-200 flex items-center">
              <div><div className="text-lg font-bold text-blue-700">UzCRM</div>
                <div className="text-xs text-slate-500 truncate">{profile.name}</div></div>
              <button onClick={() => setMenu(false)} className="ml-auto text-slate-400"><Ic d={P.x} size={20} /></button>
            </div>
            <div className="flex-1 overflow-y-auto"><NavList onPick={() => setMenu(false)} /></div>
            <button onClick={onLogout} className="m-3 flex items-center gap-2 text-sm text-red-600 px-3 py-2">
              <Ic d={P.out} size={16} /> Chiqish</button>
          </div></div>)}

      <main className="flex-1 min-w-0">
        <header className="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex items-center gap-3 sticky top-0 z-30">
          <button onClick={() => setMenu(true)} className="lg:hidden text-slate-600 p-1"><Ic d={P.menu} size={20} /></button>
          <div className="relative flex-1 max-w-md">
            <span className="absolute left-3 top-2.5 text-slate-400"><Ic d={P.search} size={15} /></span>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Lid qidirish…"
              className="w-full border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </header>

        {D.funnels.length > 1 && (view === "funnel" || view === "dash") && (
          <div className="px-4 sm:px-6 pt-4">
            <Tabs items={D.funnels.map(f => [f.id, f.name])} value={fid} onChange={setFid} />
          </div>)}

        {msg && <div className="mx-4 sm:mx-6 mt-3 text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5 flex gap-2">
          <span className="flex-1">{msg}</span><button onClick={() => setMsg("")}><Ic d={P.x} size={16} /></button></div>}

        {loading ? <Spinner /> : <>
          {view === "inbox" && (
            <div className="p-4 sm:p-6">
              <div className="mb-4">
                <h2 className="text-lg font-bold text-slate-900">Qabul qilinmagan lidlar</h2>
                <p className="text-xs text-slate-500">Facebook, sayt va boshqa manbalardan avtomatik tushgan lidlar</p>
              </div>
              {!unsorted.length ? <Empty title="Hammasi qabul qilingan" hint="Yangi lidlar shu yerda paydo bo'ladi." /> : (
                <Card className="divide-y divide-slate-100">
                  {unsorted.map(l => (
                    <div key={l.id} className="flex items-center gap-3 p-4 flex-wrap">
                      <span className="w-10 h-10 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center shrink-0"><Ic d={P.file} size={18} /></span>
                      <div className="flex-1 min-w-[10rem] cursor-pointer" onClick={() => setOpen(l)}>
                        <div className="text-sm font-medium text-slate-900">{l.name}</div>
                        <div className="text-xs text-slate-500">{l.phone || "—"} · {l.source} · {String(l.created_at).slice(0, 10)}</div>
                      </div>
                      <Btn size="sm" onClick={() => accept(l)}>Qabul qilish</Btn>
                      <Btn size="sm" kind="ghost" onClick={() => setOpen(l)}>Ochish</Btn>
                    </div>))}
                </Card>)}
            </div>)}
          {view === "dash" && <Dashboard leads={curLeads} stages={curStages} tasks={D.tasks} people={managers} dash={settings.dashboard} />}
          {view === "funnel" && (curStages.length
            ? <FunnelView leads={curLeads.filter(l => !l.unsorted)} stages={curStages} people={managers}
                allTags={allTags} onOpen={setOpen} onAdd={() => setAdding(true)} onMove={moveLead} onBulk={bulkMove} />
            : <div className="p-6"><Empty title="Varonka topilmadi" hint="Sozlamalar bo'limidan varonka qo'shing." /></div>)}
          {view === "chats" && <ChatsView messages={D.messages} leads={D.leads} onOpen={setOpen} />}
          {view === "ai" && <AIView leads={D.leads} people={managers} scenario={scenario} setScenario={setScenario}
            onOpen={setOpen} onBulk={bulkAi} />}
          {view === "contacts" && <ContactsView contacts={D.contacts} companies={D.companies} reload={load} setMsg={setMsg} />}
          {view === "products" && <ProductsView products={D.products} reload={load} can={can} setMsg={setMsg} />}
          {view === "taskboard" && <TasksBoard tasks={D.tasks} leads={D.leads} onMove={moveTask} />}
          {view === "tasks" && <TasksList tasks={D.tasks} leads={D.leads} onToggle={toggleTask} />}
          {view === "calls" && <CallsView calls={D.calls} leads={D.leads} onOpen={setOpen} />}
          {view === "settings" && <SettingsView funnels={D.funnels} stages={D.stages} robots={D.robots} people={D.people}
            tenant={D.tenant} groups={D.groups} fields={D.fields} settings={settings} saveSettings={saveSettings}
            reload={load} setMsg={setMsg} />}
        </>}
      </main>

      <Sheet open={!!open} onClose={() => setOpen(null)} wide>
        {open && <LeadSheet lead={open} stages={D.stages.filter(s => s.funnel_id === open.funnel_id)}
          people={managers} products={D.products} groups={D.groups} fields={D.fields}
          contacts={D.contacts} companies={D.companies} allTags={allTags}
          scenario={scenario} can={can} onClose={() => setOpen(null)} onSaved={load} />}
      </Sheet>

      <Sheet open={adding} onClose={() => setAdding(false)}>
        <div className="p-5 space-y-3">
          <div className="text-lg font-bold text-slate-900">Yangi lid</div>
          <Input placeholder="Lid nomi" value={nl.name} onChange={e => setNl({ ...nl, name: e.target.value })} />
          <Input placeholder="Telefon" type="tel" value={nl.phone} onChange={e => setNl({ ...nl, phone: e.target.value })} />
          <Input placeholder="Byudjet" type="number" inputMode="numeric" value={nl.budget} onChange={e => setNl({ ...nl, budget: e.target.value })} />
          <Select value={nl.source} onChange={e => setNl({ ...nl, source: e.target.value })}>
            {SOURCES.map(s => <option key={s}>{s}</option>)}</Select>
          <Btn className="w-full" onClick={addLead}>Lidni saqlash</Btn>
        </div></Sheet>
    </div>);
}

/* ---------- Asosiy ---------- */
function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [err, setErr] = useState("");
  useEffect(() => {
    if (!db) return;
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => { setSession(s); setProfile(null); setErr(""); });
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    if (!session || !db) return;
    db.from("profiles").select("*").eq("id", session.user.id).maybeSingle().then(({ data, error }) => {
      if (error) setErr(humanError(error));
      else if (!data) setErr("Hisobingiz tizimga ulanmagan. Administratorga murojaat qiling.");
      else setProfile(data);
    });
  }, [session]);
  const logout = () => db.auth.signOut();

  if (!SUPABASE_URL || SUPABASE_URL.indexOf("BU_YERGA") >= 0 || !SUPABASE_ANON_KEY) return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="max-w-sm text-center"><div className="text-lg font-bold text-slate-900">Sozlama kiritilmagan</div>
        <div className="text-sm text-slate-600 mt-2"><code className="bg-slate-100 px-1 rounded">config.js</code> fayli topilmadi yoki noto'g'ri.</div></div></div>);
  if (session === undefined) return <Spinner />;
  if (!session) return <Login />;
  if (err) return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="max-w-sm text-center"><div className="text-sm text-red-600 bg-red-50 rounded-lg px-4 py-3">{err}</div>
        <button onClick={logout} className="text-sm text-slate-500 mt-4">Chiqish</button></div></div>);
  if (!profile) return <Spinner />;
  if (profile.role === "owner") return <OwnerPanel onLogout={logout} />;
  return <Workspace profile={profile} onLogout={logout} />;
}

try { ReactDOM.createRoot(document.getElementById("root")).render(<App />); }
catch (e) { window.__err(e && e.message ? e.message : e); }

</script>
